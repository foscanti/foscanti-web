name: Deploy to S3 + CloudFront

# Deploys the static export to S3 and invalidates the CloudFront cache.
# Runs automatically when changes land on the default branch, and can also
# be triggered manually from the Actions tab.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Required for OIDC federation with AWS (no long-lived access keys needed).
permissions:
  id-token: write
  contents: read

# Never run two deploys at once; cancel an in-progress deploy if a newer
# commit arrives.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Non-secret deploy targets are hardcoded here so they can't be misconfigured
    # in repo settings. Only AWS_ROLE_ARN remains a secret.
    env:
      AWS_REGION: eu-central-1
      S3_BUCKET: foscanti.com
      CLOUDFRONT_DISTRIBUTION_ID: E127NN2P6GI3GI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          ZOHO_USER: ${{ secrets.ZOHO_USER }}
          ZOHO_PASS: ${{ secrets.ZOHO_PASS }}
          ZOHO_HOST: ${{ secrets.ZOHO_HOST }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          NEXT_PUBLIC_LAMBDA_ENDPOINT: ${{ secrets.LAMBDA_ENDPOINT }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          # Long-cache the fingerprinted assets under /_next, short-cache the
          # HTML so new deploys are picked up promptly.
          aws s3 sync ./out "s3://$S3_BUCKET" \
            --delete \
            --exclude "_next/*" \
            --cache-control "public, max-age=0, must-revalidate"

          aws s3 sync ./out/_next "s3://$S3_BUCKET/_next" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
